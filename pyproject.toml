[project]
name = "plex-anidb-reconciler"
version = "0.1.0"
description = "Reconcile Plex watched flags with AniDB MyList via Shoko"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["httpx"]

[project.scripts]
pxar = "plex_anidb_reconciler.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "respx", "ruff"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
