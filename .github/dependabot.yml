version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (updates the pin and its version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Keeps the digest-pinned base images in the Dockerfile current (distroless, debian, uv).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Python dependencies in uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
