name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --python 3.14
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -v --cov=plex_anidb_reconciler --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Smoke test: load the image into the runner's Docker and run it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: plex-anidb-reconciler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm plex-anidb-reconciler:ci --help
      - name: Config error exits 1 without leaking values
        run: |
          set +e
          out=$(docker run --rm -e SHOKO_API_KEY=CANARYSECRET plex-anidb-reconciler:ci plan 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          ! grep -q CANARYSECRET <<<"$out"
      # Same build (from cache) with SBOM + provenance attestations, exported locally.
      - uses: docker/build-push-action@v7
        with:
          context: .
          sbom: true
          provenance: mode=max
          outputs: type=local,dest=build-out
          cache-from: type=gha
      - name: Collect attestations
        run: |
          mkdir -p sbom
          cp build-out/sbom*.json build-out/provenance.json sbom/
          ls -la sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
