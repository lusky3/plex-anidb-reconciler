# Copy to compose.yml and replace the placeholders (/path/to/..., <section-ids>, network `media`).
# Secrets: copy .env.example to .env.
# Setup steps: docs/deployment.md
services:
  plex-anidb-reconciler:
    # For production, pin a version tag or digest. `build: .` works for local builds.
    image: ghcr.io/lusky3/plex-anidb-reconciler:latest
    container_name: plex-anidb-reconciler
    restart: unless-stopped
    # Hardening: non-root, read-only root filesystem, no capabilities, no privilege escalation.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    # Keep above SHUTDOWN_GRACE_S (default 25 s).
    stop_grace_period: 30s
    # No published ports: /trigger is unauthenticated. Tautulli reaches :8787 over the shared network.
    networks:
      - media
    # <shoko-data> and <state-dir> are explained in docs/deployment.md. uid 10001 has to own /data
    # and be able to read /mylist.
    volumes:
      - /path/to/shoko-data/MyList:/mylist:ro
      - /path/to/state-dir:/data
    environment:
      SHOKO_URL: http://shoko:8111
      PLEX_URL: http://plex:32400
      # Required: the Plex library section ids holding your anime, e.g. "3" or "3,7".
      PLEX_SECTIONS: "<section-ids>"
      # Timezone Shoko runs in (default UTC).
      SHOKO_TZ: UTC
      # Plex path prefix = Shoko path prefix, ';'-separated for several roots.
      # PATH_MAP: /plex/anime=/shoko/anime
      # Secrets: from .env next to this file, or exported by your secret manager.
      SHOKO_API_KEY: ${SHOKO_API_KEY:?set SHOKO_API_KEY}
      PLEX_TOKEN: ${PLEX_TOKEN:?set PLEX_TOKEN}

networks:
  # Use the existing network that Plex, Shoko and Tautulli share.
  media:
    external: true
